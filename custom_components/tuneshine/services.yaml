show_text:
  fields:
    device_id:
      selector:
        device:
          integration: tuneshine
          multiple: true
    message:
      required: true
      example: "Doorbell!"
      selector:
        text:
          multiline: true
    duration:
      default: 10
      selector:
        number:
          min: 1
          max: 3600
          unit_of_measurement: s
    color:
      selector:
        color_rgb:

show_image:
  fields:
    device_id:
      selector:
        device:
          integration: tuneshine
          multiple: true
    camera_entity:
      selector:
        entity:
          domain: camera
    url:
      example: "https://example.com/image.png"
      selector:
        text:
          type: url
    duration:
      default: 10
      selector:
        number:
          min: 1
          max: 3600
          unit_of_measurement: s

show_page:
  fields:
    device_id:
      selector:
        device:
          integration: tuneshine
          multiple: true
    page:
      required: true
      example: "weather"
      selector:
        text:

clear:
  fields:
    device_id:
      selector:
        device:
          integration: tuneshine
          multiple: true
